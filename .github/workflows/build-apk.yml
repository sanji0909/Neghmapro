name: Build Naghma Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NaghmaPro-v0.6-build-apk-online.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          ZIP="NaghmaPro-v0.6-build-apk-online.zip"
          test -f "$ZIP" || {
            echo "ERROR: Project ZIP not found in repository root"
            exit 1
          }

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          BUILD_FILE="$(find extracted -type f -name build.gradle.kts \
            -not -path '*/build/*' | head -n 1)"

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE="$(find extracted -type f -name build.gradle \
              -not -path '*/build/*' | head -n 1)"
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Android build.gradle(.kts) found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          while [ "$PROJECT_DIR" != "extracted" ] && \
                [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
                [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; do
            PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          done

          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          # Bypass compileSdk check for newer libraries
          echo "android.suppressUnsupportedCompileSdk=35" >> "$PROJECT_DIR/gradle.properties"
          echo "android.suppressUnsupportedCompileSdk=36" >> "$PROJECT_DIR/gradle.properties"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew || true
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload NaghmaPro APK
        uses: actions/upload-artifact@v4
        with:
          name: NaghmaPro-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
