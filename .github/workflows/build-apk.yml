name: Build Naghma Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract ZIP and locate project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _source
          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -iname '*.zip' -not -path './.git/*' \
            -print -quit)"

          if [ -n "$ZIP_FILE" ]; then
            unzip -oq "$ZIP_FILE" -d _source
          fi

          PROJECT_DIR="$(find . -type f \
            -name 'settings.gradle.kts' \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find . -type f \
              -name 'settings.gradle' \
              -not -path './.git/*' \
              -not -path '*/build/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle(.kts)."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"
          
          # Auto-suppress compileSdk version mismatch
          echo "android.suppressUnsupportedCompileSdk=36" >> "$PROJECT_DIR/gradle.properties"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaghmaPro-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
